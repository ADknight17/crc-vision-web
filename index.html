function otsu(a,valid){let mn=1e9,mx=-1e9,n=0;for(let i=0;i<a.length;i++)if(valid[i]){mn=Math.min(mn,a[i]);mx=Math.max(mx,a[i])}

    for(const p of c.idx){mR+=R[p];mG+=G[p];mB+=B[p];{const mx=Math.max(R[p],G[p],B[p]),mn=Math.min(R[p],G[p],B[p]);if(L[p]>170&&mx-mn<.3*mx)pl++}iL+=L[p];iR+=cr[p];ih+=hp[p]*hp[p];ms+=sal[p];cx+=p%w;cy+=(p/w)|0}

const NAMES={G1:'Well differentiated',G2:'Moderately differentiated',G3:'Poorly differentiated'};
function inv3(m){const[a,b,c,d,e,f,g,h,i]=m.flat(),A=e*i-f*h,B=-(d*i-f*g),C=d*h-e*g,D=-(b*i-c*h),E=a*i-c*g,F=-(a*h-b*g),G=b*f-c*e,H=-(a*f-c*d),I=a*e-b*d,det=a*A+b*B+c*C;return[[A,D,G],[B,E,H],[C,F,I]].map(r=>r.map(v=>v/det))}

function runGrade(px){

  const clean=morph(morph(bright,w,h,false),w,h,true);let bp=0;for(let i=0;i<N;i++)bp+=clean[i];

function tooSmall(img){return img.naturalWidth<48||img.naturalHeight<48}
function analyzeLesion(img){if(tooSmall(img))return{error:'Image is too small (minimum 48 px).'};imgEl=img;return runLesion(getPixels(img))}
function analyzeGrade(img){if(tooSmall(img))return{error:'Image is too small (minimum 48 px).'};imgEl=img;return runGrade(getPixels(img))}

const {useState,useEffect,useRef}=React;

const pretty=k=>{const t=k.replace(/_/g,' ');return t[0].toUpperCase()+t.slice(1)};

const GRADE={G1:{name:'Well differentiated',hex:'#10b981'},G2:{name:'Moderately differentiated',hex:'#f59e0b'},G3:{name:'Poorly differentiated',hex:'#ef4444'}};

const ic=d=>({className='h-5 w-5'})=>html`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" className=${className} aria-hidden="true" dangerouslySetInnerHTML=${{__html:d}}></svg>`;
const Sun=ic('<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>');
const Moon=ic('<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>');

const Scan=ic('<path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3"/><path d="M4 12h16"/>');
const Alert=ic('<path d="M12 3l10 18H2L12 3z"/><path d="M12 10v5M12 18h.01"/>');
const Lock=ic('<rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>');
const Target=ic('<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/><path d="M12 1v3M12 20v3M1 12h3M20 12h3"/>');
const Micro=ic('<path d="M6 18h8M3 22h18M14 22a7 7 0 0 0 0-14h-1M9 14h2"/><path d="M9 12a2 2 0 0 1-2-2V6h6v4a2 2 0 0 1-2 2z"/><path d="M12 6V3a1 1 0 0 0-1-1H9a1 1 0 0 0-1 1v3"/>');
const Img=ic('<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="M21 15l-5-5L5 21"/>');
const X=ic('<path d="M18 6L6 18M6 6l12 12"/>');
const Layers=ic('<path d="M12 2l10 5-10 5L2 7l10-5z"/><path d="M2 12l10 5 10-5M2 17l10 5 10-5"/>');

const Card=({className,children})=>html`<div className=${cx('rounded-2xl border border-slate-200/80 bg-white/80 shadow-sm shadow-slate-200/50 backdrop-blur dark:border-slate-800 dark:bg-slate-900/70 dark:shadow-none',className)}>${children}</div>`;
const Lbl=({children})=>html`<div className="mb-3 text-[11px] font-semibold uppercase tracking-[0.14em] text-slate-500 dark:text-slate-400">${children}</div>`;
const Warn=({children})=>html`<div className="flex gap-2.5 rounded-xl border border-amber-300/60 bg-amber-50 px-3.5 py-2.5 text-sm text-amber-800 dark:border-amber-500/30 dark:bg-amber-500/10 dark:text-amber-300"><${Alert} className="mt-0.5 h-4 w-4 shrink-0"/><div>${children}</div></div>`;

function Bars({data,colors}){
  const [on,setOn]=useState(false);
  useEffect(()=>{const t=setTimeout(()=>setOn(true),40);return()=>clearTimeout(t)},[]);
  const keys=Object.keys(data).sort((a,b)=>data[b]-data[a]);
  return html`<div className="space-y-3">${keys.map((k,i)=>html`
    <div key=${k} className="grid grid-cols-[minmax(0,9.5rem)_1fr_2.75rem] items-center gap-3 text-sm">
      <span className=${cx('truncate',i===0?'font-semibold text-slate-900 dark:text-white':'text-slate-500 dark:text-slate-400')}>${pretty(k)}</span>
      <div className="h-2.5 overflow-hidden rounded-full bg-slate-200/80 dark:bg-slate-800">
        <div className=${cx('h-full rounded-full transition-all duration-700 ease-out',!colors&&(i===0?'bg-gradient-to-r from-emerald-400 to-cyan-500':'bg-slate-400/70 dark:bg-slate-600'))} style=${{width:on?data[k]*100+'%':'0%',background:colors?colors[k]:undefined,opacity:colors&&i>0?.55:1}}></div>
      </div>
      <span className="text-right tabular-nums text-slate-500 dark:text-slate-400">${Math.round(data[k]*100)}%</span>
    </div>`)}</div>`;
}

function Ring({value,color,children}){
  const r=38,c=2*Math.PI*r,[on,setOn]=useState(false);
  useEffect(()=>{const t=setTimeout(()=>setOn(true),60);return()=>clearTimeout(t)},[]);
  return html`<div className="relative h-24 w-24 shrink-0">
    <svg viewBox="0 0 100 100" className="h-full w-full -rotate-90">
      <circle cx="50" cy="50" r=${r} fill="none" strokeWidth="9" className="stroke-slate-200 dark:stroke-slate-800"/>
      <circle cx="50" cy="50" r=${r} fill="none" strokeWidth="9" strokeLinecap="round" stroke=${color} strokeDasharray=${(on?c*value:0)+' '+c} style=${{transition:'stroke-dasharray .9s ease'}}/>
    </svg>
    <div className="absolute inset-0 flex items-center justify-center">${children}</div></div>`;
}

function CanvasView({base,dets,sel}){
  const ref=useRef(null);
  useEffect(()=>{
    const cv=ref.current;if(!cv||!base)return;
    cv.width=base.width;cv.height=base.height;
    const x=cv.getContext('2d');x.drawImage(base,0,0);
    if(!dets)return;
    const lw=Math.max(3,Math.round(Math.max(cv.width,cv.height)/200)),fs=Math.max(14,Math.round(cv.width/38)),col='#10e0a0';
    dets.forEach((d,i)=>{const[x0,y0,x1,y1]=d.box,on=i===sel;
      x.globalAlpha=on?1:.5;x.strokeStyle=col;x.lineWidth=on?lw*1.5:lw;x.setLineDash(on?[]:[lw*3,lw*2]);x.strokeRect(x0,y0,x1-x0,y1-y0);x.setLineDash([]);
      if(on){x.globalAlpha=.14;x.fillStyle=col;x.fillRect(x0,y0,x1-x0,y1-y0)}
      x.globalAlpha=1;x.font='700 '+fs+'px sans-serif';const t='#'+d.n,tw=x.measureText(t).width+14;
      x.fillStyle=col;x.fillRect(x0,Math.max(0,y0-fs-8),tw,fs+8);x.fillStyle='#04120c';x.fillText(t,x0+7,Math.max(fs,y0-8))});
  },[base,dets,sel]);
  return html`<canvas ref=${ref} className="mx-auto block h-auto max-h-[28rem] w-auto max-w-full rounded-xl bg-slate-100 dark:bg-slate-950"></canvas>`;
}

function Dropzone({st,mode,onFile,onClear}){
  const [over,setOver]=useState(false),inp=useRef(null),busy=st.status==='working';
  const drop=e=>{e.preventDefault();setOver(false);const f=e.dataTransfer.files&&e.dataTransfer.files[0];if(f)onFile(f)};
  return html`<div>
    <input ref=${inp} type="file" accept="image/png,image/jpeg,image/webp,image/bmp" className="hidden" onChange=${e=>{const f=e.target.files[0];if(f)onFile(f);e.target.value=''}}/>
    <div role="button" tabIndex="0" aria-label="Upload an image"
      onClick=${()=>!st.url&&inp.current.click()} onKeyDown=${e=>{if((e.key==='Enter'||e.key===' ')&&!st.url){e.preventDefault();inp.current.click()}}}
      onDragOver=${e=>{e.preventDefault();setOver(true)}} onDragLeave=${()=>setOver(false)} onDrop=${drop}
      className=${cx('relative flex min-h-[18rem] items-center justify-center overflow-hidden rounded-xl border-2 border-dashed transition',over?'border-emerald-400 bg-emerald-50 dark:bg-emerald-500/10':'border-slate-300 bg-slate-50 hover:border-emerald-400 dark:border-slate-700 dark:bg-slate-900/60',!st.url&&'cursor-pointer')}>
      ${st.url?html`<img src=${st.url} alt="Uploaded preview" className="max-h-[26rem] w-full object-contain"/>`:html`
        <div className="px-6 py-10 text-center">
          <div className="mx-auto mb-4 flex h-14 w-14 items-center justify-center rounded-2xl bg-gradient-to-br from-emerald-400/20 to-cyan-500/20 text-emerald-600 dark:text-emerald-300"><${Upload} className="h-7 w-7"/></div>
          <p className="font-semibold">Drop ${mode==='lesion'?'an endoscopy frame':'a histology patch'} here</p>
          <p className="mt-1 text-sm text-slate-500 dark:text-slate-400">or click to browse · JPEG, PNG, WebP</p>
        </div>`}
      ${busy&&html`<div className="pointer-events-none absolute inset-0"><div className="scanline absolute inset-x-0 h-1/3 bg-gradient-to-b from-transparent via-emerald-400/40 to-transparent"></div></div>`}
      ${st.url&&!busy&&html`<button onClick=${e=>{e.stopPropagation();onClear()}} aria-label="Remove image" className="absolute right-3 top-3 rounded-full bg-slate-900/70 p-1.5 text-white transition hover:bg-slate-900"><${X} className="h-4 w-4"/></button>`}
    </div>
    ${st.error&&html`<div className="mt-3"><${Warn}>${st.error}<//></div>`}
  </div>`;
}

/* ---------- Lesion views ---------- */
function LesionShow({res,sel,onSel}){
  return html`<div className="fade-up">
    ${res.isHist&&html`<div className="mb-3"><${Warn}>This looks like a histology image, not an endoscopy frame. Results are probably meaningless.<//></div>`}
    <${CanvasView} base=${res.base} dets=${res.dets} sel=${sel}/>
    <div className="mt-4 flex flex-wrap items-center gap-2">
      ${res.dets.length?res.dets.map((d,i)=>html`<button key=${d.n} onClick=${()=>onSel(i)} aria-pressed=${i===sel} className=${cx('rounded-full border px-3.5 py-1.5 text-sm font-medium transition',i===sel?'border-emerald-500 bg-emerald-500 text-white shadow shadow-emerald-500/30':'border-slate-300 bg-white text-slate-700 hover:border-emerald-400 dark:border-slate-700 dark:bg-slate-900 dark:text-slate-200')}>Region #${d.n} · ${Math.round(d.conf*100)}%</button>`):html`<p className="text-sm text-slate-500 dark:text-slate-400"><b className="text-slate-800 dark:text-slate-100">No clear finding.</b> Try a sharper, well-lit frame.</p>`}
    </div></div>`;
}
function LesionDetails({res,sel}){
  const f=res.frame,d=res.dets[sel];
  const frameCard=html`<${Card} className="p-5"><${Lbl}>Frame assessment<//><div className="text-2xl font-bold tracking-tight">${pretty(topKey(f))}</div><p className="mb-4 mt-1 text-sm text-slate-500 dark:text-slate-400">Overall reading of this frame</p><${Bars} data=${f}/><//>`;
  if(!d)return html`<div className="fade-up grid gap-4 md:grid-cols-2">${frameCard}<${Card} className="p-5"><${Lbl}>Finding type<//><p className="text-sm text-slate-500 dark:text-slate-400">No localized finding to classify.</p><//></div>`;
  const why=[d.size+' region ('+(d.area*100).toFixed(0)+'% of the visible field)',
    d.circ>.7?'rounded, well-circumscribed outline':d.circ>.45?'moderately irregular outline':'irregular, spread-out outline',
    d.lumRatio>1.08?'brighter, dome-like shading vs. surroundings':d.lumRatio<.95?'darker than surroundings':'similar brightness to surroundings',
    d.rr>1.3?'strongly red / saturated colour':d.dRed>10?'noticeably redder than surrounding mucosa':d.dRed>3?'mildly redder than surrounding mucosa':'similar or paler colour than surroundings',
    d.pale>.25?'whitish / pale areas present ('+Math.round(d.pale*100)+'% of region)':'little pale or whitish material',
    d.tex>=6?'coarse surface texture':d.tex<3.5?'smooth surface':'moderate surface texture'];
  return html`<div className="fade-up space-y-4">
    <div className="grid gap-4 md:grid-cols-2">
      ${frameCard}
      <${Card} key=${sel} className="p-5"><${Lbl}>Finding type · region #${d.n}<//><div className="text-2xl font-bold tracking-tight">${pretty(topKey(d.cls))}</div><p className="mb-4 mt-1 text-sm text-slate-500 dark:text-slate-400">${d.size} region · detection score ${Math.round(d.conf*100)}%</p><${Bars} data=${d.cls}/><//>
    </div>
    <${Card} className="p-5"><${Lbl}>Why this estimate<//>
      <ul className="grid gap-x-8 gap-y-2 text-sm text-slate-600 sm:grid-cols-2 dark:text-slate-300">${why.map(w=>html`<li key=${w} className="flex gap-2"><span className="mt-2 h-1.5 w-1.5 shrink-0 rounded-full bg-emerald-500"></span>${w}</li>`)}</ul>
      ${d.hotspot&&html`<div className="mt-4"><${Warn}>This region is very bright, smooth and central. It may be the endoscope light hotspot rather than a real finding.<//></div>`}
    <//></div>`;
}

/* ---------- Grading views ---------- */
function GradeShow({res}){
  const host=useRef(null);
  useEffect(()=>{const c=res.canvas;c.className='mx-auto block h-auto max-h-[28rem] w-auto max-w-full rounded-xl';host.current.replaceChildren(c)},[res]);
  return html`<div className="fade-up">
    ${!res.isHist&&html`<div className="mb-3"><${Warn}>This does not look like an H&E histology image (pink/purple stain). The estimate may be meaningless.<//></div>`}
    <div ref=${host}></div>
    <div className="mt-3 flex flex-wrap gap-4 text-xs text-slate-500 dark:text-slate-400"><span className="flex items-center gap-1.5"><i className="h-2.5 w-2.5 rounded-sm bg-teal-400"></i>Gland-like spaces</span><span className="flex items-center gap-1.5"><i className="h-2.5 w-2.5 rounded-sm bg-red-500/70"></i>Nuclear density</span></div></div>`;
}
const Tile=({label,value})=>html`<div className="rounded-xl border border-slate-200 bg-slate-50 px-4 py-3 dark:border-slate-800 dark:bg-slate-900"><div className="text-xl font-bold tabular-nums">${value}</div><div className="text-xs text-slate-500 dark:text-slate-400">${label}</div></div>`;
function GradeDetails({res}){
  const g=res.grade,info=GRADE[g],p=res.p,colors={G1:GRADE.G1.hex,G2:GRADE.G2.hex,G3:GRADE.G3.hex};
  const why={G1:'Numerous gland-like spaces lined by nuclei with regular, rounded shapes: consistent with well-formed glands.',G2:'Some gland-like spaces are present but sparse or irregular, with partial solid areas: consistent with moderate gland formation.',G3:'Few or no nuclei-lined gland spaces; tissue is solid and cell-dense with variable nuclear size: consistent with loss of gland formation.'}[g];
  return html`<div className="fade-up space-y-4">
    <div className="grid gap-4 md:grid-cols-2">
      <${Card} className="p-5"><${Lbl}>Estimated grade<//>
        <div className="flex items-center gap-5">
          <${Ring} value=${p[g]} color=${info.hex}><span className="text-3xl font-extrabold" style=${{color:info.hex}}>${g}</span><//>
          <div><div className="text-xl font-bold tracking-tight">${info.name}</div><div className="mt-1 text-sm text-slate-500 dark:text-slate-400">${Math.round(p[g]*100)}% heuristic score</div></div>
        </div>
        <div className="mt-5"><${Bars} data=${p} colors=${colors}/></div>
      <//>
      <${Card} className="p-5"><${Lbl}>Measured features<//>
        <div className="grid grid-cols-2 gap-3"><${Tile} label="Gland-like spaces" value=${res.cnt}/><${Tile} label="Gland shape regularity" value=${Math.round(res.meanCirc*100)+'%'}/><${Tile} label="Open space" value=${(res.lumFrac*100).toFixed(1)+'%'}/><${Tile} label="Nuclei (of tissue)" value=${Math.round(res.nucFrac*100)+'%'}/></div>
        <p className="mt-4 text-sm text-slate-600 dark:text-slate-300">${why}</p>
        <p className="mt-2 text-xs text-slate-500 dark:text-slate-400">Nuclear size variation: ${res.nucCV.toFixed(2)}</p>
      <//>
    </div></div>`;
}

/* ---------- App ---------- */
const initSess=()=>({status:'idle',file:null,img:null,url:null,error:null,result:null,sel:0});
function App(){
  const [theme,setTheme]=useState(()=>document.documentElement.classList.contains('dark')?'dark':'light');
  const [mode,setMode]=useState('lesion');
  const [S,setS]=useState({lesion:initSess(),grade:initSess()});
  const st=S[mode];
  const patch=(m,p)=>setS(s=>({...s,[m]:{...s[m],...p}}));
  const toggle=()=>{const n=theme==='dark'?'light':'dark';setTheme(n);document.documentElement.classList.toggle('dark',n==='dark');document.documentElement.dataset.theme=n;try{localStorage.setItem('crc-theme',n)}catch(e){}};
  const onFile=f=>{
    const m=mode;
    if(!/^image\//.test(f.type)){patch(m,{error:'Please choose an image file (JPEG, PNG or WebP).'});return}
    if(f.size>25*1024*1024){patch(m,{error:'That image is larger than 25 MB.'});return}
    const url=URL.createObjectURL(f),img=new Image();
    img.onload=()=>{if(S[m].url)URL.revokeObjectURL(S[m].url);patch(m,{file:f,img,url,status:'ready',result:null,error:null,sel:0})};
    img.onerror=()=>{URL.revokeObjectURL(url);patch(m,{error:'That image could not be read. Try a different file.'})};
    img.src=url;
  };
  const clear=()=>{if(st.url)URL.revokeObjectURL(st.url);patch(mode,initSess())};
  const analyze=async()=>{
    const m=mode,img=S[m].img;if(!img)return;
    patch(m,{status:'working',error:null});
    await new Promise(r=>setTimeout(r,350));
    try{const res=m==='lesion'?analyzeLesion(img):analyzeGrade(img);
      if(res.error)patch(m,{status:'ready',result:null,error:res.error});else patch(m,{status:'done',result:res,sel:0})}
    catch(e){patch(m,{status:'ready',error:'Analysis failed: '+e.message})}
  };
  const tabs=[['lesion','Lesion Detection','Endoscopy frame → findings & type',Target],['grade','Cancer Grading','H&E patch → G1 / G2 / G3',Micro]];
  const busy=st.status==='working',done=st.status==='done'&&st.result;
  return html`<div className="relative min-h-screen overflow-x-hidden bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100">
    <div className="pointer-events-none absolute inset-0 -z-0 overflow-hidden" aria-hidden="true">
      <div className="absolute -left-32 -top-32 h-[28rem] w-[28rem] rounded-full bg-emerald-400/20 blur-3xl dark:bg-emerald-500/10"></div>
      <div className="absolute -right-32 top-24 h-[26rem] w-[26rem] rounded-full bg-cyan-400/20 blur-3xl dark:bg-indigo-500/10"></div>
    </div>
    <header className="sticky z-20 border-b border-slate-200/70 bg-white/70 backdrop-blur-xl dark:border-slate-800/70 dark:bg-slate-950/70" style=${{top:'env(safe-area-inset-top,0px)'}}>
      <div className="mx-auto flex max-w-6xl items-center justify-between px-5 py-3">
        <div className="flex items-center gap-3"><div className="flex h-9 w-9 items-center justify-center rounded-xl bg-gradient-to-br from-emerald-400 to-cyan-500 text-white shadow-lg shadow-emerald-500/30"><${Scan} className="h-5 w-5"/></div>
          <div className="leading-tight"><div className="font-bold tracking-tight">CRC Vision</div><div className="text-[11px] text-slate-500 dark:text-slate-400">Colorectal image estimator</div></div></div>
        <button onClick=${toggle} aria-label=${theme==='dark'?'Switch to light mode':'Switch to dark mode'} title="Toggle theme" className="flex h-10 w-10 items-center justify-center rounded-xl border border-slate-200 bg-white text-slate-700 transition hover:border-emerald-400 hover:text-emerald-600 dark:border-slate-800 dark:bg-slate-900 dark:text-slate-200">${theme==='dark'?html`<${Sun}/>`:html`<${Moon}/>`}</button>
      </div></header>

    <main className="relative z-10 mx-auto max-w-6xl px-5 pb-20 pt-10">
      <section className="mb-8 max-w-2xl">
        <h1 className="text-4xl font-extrabold leading-tight tracking-tight sm:text-5xl">Analyze colorectal images <span className="bg-gradient-to-r from-emerald-500 to-cyan-500 bg-clip-text text-transparent">in seconds</span></h1>
        <p className="mt-4 text-lg text-slate-600 dark:text-slate-300">Locate and type lesions in endoscopy frames, or estimate the differentiation grade of a histology patch. Everything runs privately in your browser.</p>
        <div className="mt-5 flex flex-wrap gap-2 text-xs font-medium">
          <span className="flex items-center gap-1.5 rounded-full border border-slate-200 bg-white px-3 py-1.5 dark:border-slate-800 dark:bg-slate-900"><${Lock} className="h-3.5 w-3.5 text-emerald-500"/>Images never leave your device</span>
          <span className="flex items-center gap-1.5 rounded-full border border-slate-200 bg-white px-3 py-1.5 dark:border-slate-800 dark:bg-slate-900"><${Layers} className="h-3.5 w-3.5 text-emerald-500"/>14 Kvasir-Capsule classes</span>
          <span className="flex items-center gap-1.5 rounded-full border border-slate-200 bg-white px-3 py-1.5 dark:border-slate-800 dark:bg-slate-900"><${Micro} className="h-3.5 w-3.5 text-emerald-500"/>G1 · G2 · G3 grading</span>
        </div>
      </section>

      <div className="mb-6"><${Warn}><b>Estimator, not a diagnostic tool.</b> Results come from image-analysis rules, not a trained or validated model, so accuracy is unmeasured and errors are expected. Never use for medical decisions.<//></div>

      <div role="tablist" className="mb-6 grid gap-3 sm:grid-cols-2">${tabs.map(([k,t,sub,Ico])=>html`
        <button key=${k} role="tab" aria-selected=${mode===k} onClick=${()=>setMode(k)} className=${cx('flex items-center gap-4 rounded-2xl border p-4 text-left transition',mode===k?'border-emerald-500 bg-white shadow-lg shadow-emerald-500/10 ring-1 ring-emerald-500 dark:bg-slate-900':'border-slate-200 bg-white/60 hover:border-emerald-400 dark:border-slate-800 dark:bg-slate-900/50')}>
          <div className=${cx('flex h-11 w-11 shrink-0 items-center justify-center rounded-xl',mode===k?'bg-gradient-to-br from-emerald-400 to-cyan-500 text-white':'bg-slate-100 text-slate-500 dark:bg-slate-800 dark:text-slate-400')}><${Ico} className="h-6 w-6"/></div>
          <div><div className="font-bold">${t}</div><div className="text-sm text-slate-500 dark:text-slate-400">${sub}</div></div></button>`)}</div>

      <div className="grid gap-5 lg:grid-cols-2">
        <${Card} className="p-5"><${Lbl}>${mode==='lesion'?'Endoscopy frame':'H&E histology patch'}<//>
          <${Dropzone} key=${mode} st=${st} mode=${mode} onFile=${onFile} onClear=${clear}/>
          <div className="mt-4 flex items-center justify-end gap-3">
            ${st.url&&html`<button onClick=${()=>document.querySelector('input[type=file]').click()} disabled=${busy} className="rounded-xl px-4 py-2.5 text-sm font-medium text-slate-600 transition hover:text-emerald-600 disabled:opacity-40 dark:text-slate-300">Change image</button>`}
            <button onClick=${analyze} disabled=${!st.img||busy} className="rounded-xl bg-gradient-to-r from-emerald-500 to-cyan-500 px-6 py-2.5 text-sm font-semibold text-white shadow-lg shadow-emerald-500/25 transition hover:brightness-110 disabled:cursor-not-allowed disabled:opacity-40 disabled:shadow-none">${busy?'Analyzing…':'Analyze'}</button>
          </div>
        <//>
        <${Card} className="p-5"><${Lbl}>${mode==='lesion'?'Detection':'Grading'}<//>
          ${done?(mode==='lesion'?html`<${LesionShow} res=${st.result} sel=${st.sel} onSel=${i=>patch('lesion',{sel:i})}/>`:html`<${GradeShow} res=${st.result}/>`)
            :busy?html`<div className="flex min-h-[18rem] animate-pulse flex-col items-center justify-center gap-3 text-slate-400"><${Scan} className="h-10 w-10"/><span className="text-sm">Analyzing image…</span></div>`
            :html`<div className="flex min-h-[18rem] flex-col items-center justify-center gap-3 text-center text-slate-400 dark:text-slate-500"><${Img} className="h-10 w-10"/><p className="max-w-xs text-sm">Upload an image and press <b>Analyze</b>. Results appear here.</p></div>`}
        <//>
      </div>

      ${done&&html`<div className="mt-5" key=${mode}>${mode==='lesion'?html`<${LesionDetails} res=${st.result} sel=${st.sel}/>`:html`<${GradeDetails} res=${st.result}/>`}</div>`}
    </main>
    <footer className="relative z-10 border-t border-slate-200/70 py-8 text-center text-xs text-slate-500 dark:border-slate-800/70 dark:text-slate-400"><div className="mx-auto max-w-3xl px-5">CRC Vision is a research demo built with React and Tailwind. Scores are rule-of-thumb estimates, not calibrated probabilities. A qualified clinician must confirm any finding.</div></footer>
  </div>`;
}

class Boundary extends React.Component{
  constructor(p){super(p);this.state={err:null}}
  static getDerivedStateFromError(e){return{err:e}}
  render(){return this.state.err?html`<div className="p-10 text-center"><h1 className="text-xl font-bold">Something went wrong</h1><p className="mt-2 text-slate-500">${String(this.state.err.message||this.state.err)}</p><button className="mt-4 rounded-lg bg-emerald-500 px-4 py-2 text-white" onClick=${()=>location.reload()}>Reload</button></div>`:this.props.children}
}
ReactDOM.createRoot(document.getElementById('root')).render(html`<${Boundary}><${App}/><//>`);

})();
</script>
</body>
</html>
